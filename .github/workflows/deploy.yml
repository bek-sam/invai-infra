name: Deploy
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "SST stage to deploy"
        required: true
        default: demo
        type: choice
        options: [demo, staging, production]
  push:
    tags: ["v*"]

# OIDC role assumption: no long-lived AWS keys in the repo (architecture.md §11).
permissions:
  id-token: write
  contents: read

# One deploy per stage at a time; a running deploy is never cancelled (it would leave the SST lock held).
concurrency:
  group: deploy-${{ github.event_name == 'push' && 'production' || inputs.stage }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Tag pushes deploy production; workflow_dispatch uses the chosen stage (default demo).
    # The environment name is the OIDC subject (repo:bek-sam/invai-infra:environment:<stage>)
    # and the source of the two variables below. Both are set by the owner (OI-38).
    environment: ${{ github.event_name == 'push' && 'production' || inputs.stage }}
    env:
      # Job-level so both `sst deploy` and `sst shell` (the release task) see them.
      INVAI_DOMAIN: ${{ vars.INVAI_DOMAIN }}
      INVAI_OTEL_ENDPOINT: ${{ vars.INVAI_OTEL_ENDPOINT }}
      STAGE: ${{ github.event_name == 'push' && 'production' || inputs.stage }}
    steps:
      - name: Check settings before touching AWS
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          case "$STAGE" in
            demo|staging|production) ;;
            *) echo "::error::Unknown stage '$STAGE'. Use demo, staging or production."; exit 1 ;;
          esac
          if [ -z "$INVAI_DOMAIN" ]; then
            echo "::error::The variable INVAI_DOMAIN is not set on the '$STAGE' environment (GitHub, Settings, Environments)."
            exit 1
          fi
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "::error::The variable AWS_DEPLOY_ROLE_ARN is not set on the '$STAGE' environment (GitHub, Settings, Environments)."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: invai-infra
      # sst.config.ts builds container images and static sites from these sibling repos —
      # same layout as local dev (all repos checked out side by side). Each needs a
      # read-only deploy key secret, same approach the app repos' own CI uses for
      # invai-contracts/invai-ui.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bek-sam/invai-backend
          path: invai-backend
          ssh-key: ${{ secrets.BACKEND_DEPLOY_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bek-sam/invai-imaging
          path: invai-imaging
          ssh-key: ${{ secrets.IMAGING_DEPLOY_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bek-sam/invai-web
          path: invai-web
          ssh-key: ${{ secrets.WEB_DEPLOY_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bek-sam/invai-floor
          path: invai-floor
          ssh-key: ${{ secrets.FLOOR_DEPLOY_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bek-sam/invai-contracts
          path: invai-contracts
          ssh-key: ${{ secrets.CONTRACTS_DEPLOY_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bek-sam/invai-ui
          path: invai-ui
          ssh-key: ${{ secrets.UI_DEPLOY_KEY }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: invai-infra/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: invai-infra/.nvmrc
          cache: pnpm
          cache-dependency-path: invai-infra/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: invai-infra
      - run: pnpm install --frozen-lockfile
        working-directory: invai-contracts
      - run: pnpm install --frozen-lockfile
        working-directory: invai-ui
      # web/floor are deployed as sst.aws.StaticSite: SST runs `pnpm build` in each directory
      # itself (no Docker), so their own install has to happen here first.
      - run: pnpm install --frozen-lockfile
        working-directory: invai-web
      - run: pnpm install --frozen-lockfile
        working-directory: invai-floor

      # OIDC: the role trusts only the environment subject (infra/iam/deploy-trust-*.json).
      # Two hours so a first deploy plus the release task cannot outlive the session.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-duration-seconds: 7200
          aws-region: us-east-1

      # The same package scripts a laptop runs: Migrate target, release task, full deploy.
      - name: Deploy (migrate, release task, full deploy)
        working-directory: invai-infra
        run: |
          case "$STAGE" in
            demo) pnpm deploy:demo ;;
            staging) pnpm deploy:staging ;;
            production) pnpm deploy:prod ;;
            *) echo "::error::Unknown stage '$STAGE'."; exit 1 ;;
          esac
