# Local services for development. Matches production engines (Postgres, Valkey, S3).
# Default profile (no --profile flag) starts infra only: postgres, valkey, minio, mailpit.
# The `full` profile also builds and runs migrate, api, worker, imaging, web and floor from the
# sibling repos' Dockerfiles, against its OWN database (invai_full), Valkey DB 9 and bucket
# invai-full, so it never touches the shared dev data. Drive it with scripts/full.sh (one image
# at a time, seed, down), not with a bare `docker compose up`. Every published port, infra and
# the profile's four app ports, binds to 127.0.0.1 only (S-62, B-322): the default dev passwords,
# placeholder secrets, demo logins and imaging dev endpoints are not reachable from the LAN.
name: local

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: invai
      POSTGRES_PASSWORD: invai
      POSTGRES_DB: invai
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invai -d invai"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: invai
      MINIO_ROOT_PASSWORD: invai-secret
      # CORS for browser uploads/downloads via presigned URLs. This is a server-wide MinIO
      # setting (`*` is actually already MinIO's own default) — MinIO's S3 PutBucketCors API
      # (per-bucket CORS) returns NotImplemented on this server version, so `mc cors set` /
      # `aws s3api put-bucket-cors` cannot be used here; the env var is the supported path.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the invai-local bucket and denies anonymous access, then exits.
  # `docker/minio/minio` on Docker Hub no longer exists; this uses quay.io/minio/mc,
  # matching the quay.io/minio/minio server image above.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 invai invai-secret &&
      mc mb --ignore-existing local/invai-local &&
      mc anonymous set none local/invai-local &&
      echo 'minio-init: bucket invai-local ready'
      "
    restart: "no"

  # SMTP catcher for vendor and invite emails. UI at :8025, SMTP at :1025 (no auth).
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Trace viewer for local tracing (T-32-5), only with `--profile observability`. OTLP/HTTP on
  # 127.0.0.1:4318 (set OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 in the shell that starts
  # api, worker and imaging), UI and query API on 127.0.0.1:16686. In-memory storage: traces are
  # gone when it stops. Bound to loopback only, like the full profile's app ports.
  jaeger:
    profiles: ["observability"]
    image: jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    ports: ["127.0.0.1:4318:4318", "127.0.0.1:16686:16686"]

  # --- full profile: production-like local run, built from the sibling repos ---
  # Own data: database invai_full, Valkey DB 9, bucket invai-full. The roles are cluster-wide, so
  # invai_app keeps its local password `invai` here (the shared dev value). Every value below is a
  # local-only placeholder, none is a secret. The api and worker run NODE_ENV=production with
  # ALLOW_MOCKS=true (mock providers, a warning on every start), as the demo stage does.

  full-db-init:
    profiles: ["full"]
    image: pgvector/pgvector@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: invai
    entrypoint: >
      /bin/sh -c "
      psql -h postgres -U invai -d postgres -tAc \"select 1 from pg_database where datname='invai_full'\" | grep -q 1
      || psql -h postgres -U invai -d postgres -v ON_ERROR_STOP=1 -c 'create database invai_full owner invai';
      echo 'full-db-init: database invai_full ready'
      "
    restart: "no"

  full-s3-init:
    profiles: ["full"]
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 invai invai-secret &&
      mc mb --ignore-existing local/invai-full &&
      mc anonymous set none local/invai-full &&
      echo 'full-s3-init: bucket invai-full ready'
      "
    restart: "no"

  # One-off release step, as the owner role: bootstrap -> migrate -> reference seed.
  migrate:
    profiles: ["full"]
    image: invai-full-backend:local
    build:
      context: ../..
      dockerfile: invai-backend/Dockerfile
    command:
      - sh
      - -c
      - node dist/db/bootstrap-cli.js && node dist/db/migrate-cli.js && node dist/db/reference-seed-cli.js
    environment: &backend-env
      NODE_ENV: production
      ALLOW_MOCKS: "true"
      DATABASE_URL: postgres://invai_app:invai@postgres:5432/invai_full
      MIGRATION_DATABASE_URL: postgres://invai:invai@postgres:5432/invai_full
      REDIS_URL: redis://valkey:6379/9
      S3_BUCKET: invai-full
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: invai
      S3_SECRET_ACCESS_KEY: invai-secret
      S3_FORCE_PATH_STYLE: "true"
      IMAGING_URL: http://imaging:8000
      IMAGING_SHARED_SECRET: invai-local-full-imaging-secret-00000
      BETTER_AUTH_SECRET: change-me-32-chars-minimum-xxxxxxxx
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:5173
      FLOOR_ORIGIN: http://localhost:5174
      FIELD_ENCRYPTION_KEY: k1:KzQaGJQ4pwuYge713w7utD2NrzYH21qNtk//UkCed+E=
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: InvAI <no-reply@invai.test>
      # The mock carrier fakes its first scan after this many hours (backend default 2). Low,
      # like dev.sh, so the golden path's "item shipped" step does not wait two hours.
      MOCK_CARRIER_TRANSIT_HOURS: "0.001"
    depends_on:
      full-db-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["full"]
    image: invai-full-backend:local
    command: ["node", "dist/api/server.js"]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      <<: *backend-env
      PORT: "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      full-s3-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  # Started by full.sh only after the seed finished (the seed parks outbox events; a worker that
  # runs during it races the seed). No HTTP listener, so the image's API healthcheck is off.
  worker:
    profiles: ["full"]
    image: invai-full-backend:local
    command: ["node", "dist/worker/index.js"]
    environment: *backend-env
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      full-s3-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  imaging:
    profiles: ["full"]
    image: invai-full-imaging:local
    build:
      context: ../../invai-imaging
      dockerfile: Dockerfile
    ports: ["127.0.0.1:8000:8000"]
    environment:
      IMAGING_SHARED_SECRET: invai-local-full-imaging-secret-00000
      S3_BUCKET: invai-full
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: invai
      S3_SECRET_ACCESS_KEY: invai-secret
      S3_CREATE_BUCKET: "false"
      # The image defaults this off (production). The demo seed needs /sample-art for its design
      # art, so the local full stack turns it on. Never set it in an AWS stage.
      IMAGING_DEV_ENDPOINTS: "true"
    depends_on:
      full-s3-init:
        condition: service_completed_successfully

  web:
    profiles: ["full"]
    image: invai-full-web:local
    build:
      context: ../..
      dockerfile: invai-web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      - api

  floor:
    profiles: ["full"]
    image: invai-full-floor:local
    build:
      context: ../..
      dockerfile: invai-floor/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports: ["127.0.0.1:5174:8080"]
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
